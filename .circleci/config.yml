version: 2.1
jobs:
  build:
    docker:
      - image: ubuntu:24.04
    steps:
      - checkout
      - run:
          name: Dependencies installeren
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake libsfml-dev
      - run:
          name: Project builden
          command: |
            mkdir -p build
            cd build
            cmake ..
            make -j2
workflows:
  build-workflow:
    jobs:
      - build
