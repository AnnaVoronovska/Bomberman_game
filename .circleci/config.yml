version: 2.1

jobs:
  build:
    docker:
      - image: ubuntu:24.04
    steps:
      - checkout

      - run:
          name: Installeer build-tools en SFML
          command: |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake g++ libsfml-dev git

      - run:
          name: Configure (CMake)
          command: |
            mkdir -p build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release

      - run:
          name: Build
          command: |
            cd build
            cmake --build . --parallel

workflows:
  build-and-check:
    jobs:
      - build